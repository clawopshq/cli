name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # CLI 는 세 OS 에서 다 돌아야 한다. 키체인 백엔드(Keychain / libsecret /
    # wincred)와 파일 락 구현이 플랫폼마다 달라서 빌드만으로는 부족하다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt 필요:"; echo "$out"; exit 1; fi
      - name: 크로스 컴파일
        run: |
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./... || exit 1
            echo "OK $t"
          done

  secrets:
    # 공개 레포다. 실계정·실번호·키가 히스토리에 들어가면 되돌릴 수 없다.
    #
    # gitleaks/gitleaks-action 은 v2 부터 조직(org) 소유 레포에서 라이선스를
    # 요구한다(clawopshq 로 옮기며 막힘) — action 대신 오픈소스 CLI 를 직접
    # 받아 돌린다. 커맨드는 action 과 동일하게 git 히스토리 전체를 스캔한다.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact -v
      - name: 실데이터 패턴 검사
        run: ./scripts/check-no-real-data.sh
