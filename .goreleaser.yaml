version: 2

project_name: clawops

before:
  hooks:
    - go mod tidy

builds:
  - id: clawops
    main: ./cmd/clawops
    binary: clawops
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# homebrew-core 는 오픈소스만 받는다. tap 없이 `brew install clawops` 를
# 목표로 하되, 초기에는 자체 tap 으로 시작한다.
brews:
  - repository:
      owner: clawopshq
      name: homebrew-tap
    homepage: https://claw-ops.com
    description: ClawOps CLI — 터미널에서 전화와 문자를 다룬다
    license: MIT

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
